<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pynix Arcade: snake</title>
    
    <!-- PyScript Core Engine -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body style="background: #111; color: white; text-align: center; font-family: monospace; margin-top: 30px;">

    
    
    <!-- Container where Python will inject the canvas -->
    <div id="game-container"></div>
    <script type="py">
      from time import time,sleep
      from random import randint
      from js import document, window
      from pyodide.ffi import create_proxy
      from pyscript import when, display
      canvasE=document.createElement("canvas")
      canvasE.width=600
      canvasE.height=600
      canvasE.style.border="2px solid #ffffff"
      canvasE.style.background="#777777"
      document.getElementById("game-container").appendChild(canvasE)
      canvas=canvasE.getContext("2d")
      #the following container config was written by gemini
      container = document.getElementById("game-container")
      container.style.position = "relative"
      container.style.width = "600px"
      container.style.margin = "0 auto"
      container.appendChild(canvasE)
      #end of gemini's writting
      snake=[(0,0)]
      fruit=(5,0)
      DIR=(0,0)
      tilesize=50
      def draw():
        canvas.fillStyle="#777777"
        canvas.fillRect(0,0,canvasE.width,canvasE.height)
        canvas.fillStyle="#0000ff"
        for seg in snake:
          canvas.fillRect(seg[0]*tilesize,seg[1]*tilesize,tilesize,tilesize)
        canvas.fillStyle="#ff0000"
        canvas.fillRect(fruit[0]*tilesize,fruit[1]*tilesize,tilesize,tilesize)
      def newbtn(id,pos,clr,size,text):
        btn=document.createElement("button")
        btn.id=id
        btn.textContent=text
        btn.style.top=f"{pos[0]}px"
        btn.style.left=f"{pos[1]}px"
        btn.style.width=f"{size[0]}px"
        btn.style.height=f"{size[1]}px"
        btn.style.backgroundColor=clr
        document.getElementById("game-container").appendChild(btn)
        return btn
      def handle_key(event):
        if event.key=="w":btnUpHandle(event)
        elif event.key=="a":btnLeftHandle(event)
        elif event.key=="s":btnDownHandle(event)
        elif event.key=="d":btnRightHandle(event)
      window.addEventListener("keydown", create_proxy(handle_key))
      @when("click",newbtn("btnUp",(620,100),"#ffffff",(50,50),"UP"))
      def btnUpHandle(event):
        globals()["DIR"]=(0,-1)
      @when("click",newbtn("btnDown",(680,100),"#ffffff",(50,50),"DOWN"))
      def btnDownHandle(event):
        globals()["DIR"]=(0,1)
      @when("click",newbtn("btnLeft",(650,40),"#ffffff",(50,50),"LEFT"))
      def btnLeftHandle(event):
        globals()["DIR"]=(-1,0)
      @when("click",newbtn("btnRight",(650,160),"#ffffff",(50,50),"RIGHT"))
      def btnRightHandle(event):
        globals()["DIR"]=(1,0)
        canvasE.style.background="#00ff00"
      
      def logic():
        ate=False
        snake.append((snake[-1][0]+DIR[0],snake[-1][1]+DIR[1]))
        if fruit in snake:
          ate=True
          globals()["fruit"]=(randint(0,canvasE.width//tilesize),randint(0,canvasE.height//tilesize))
        else:
          snake.pop(0)
      globals()["lasttick"]=time()
      def gameloop(timestamp):
        curtime=time()
        sincelasttick=curtime-globals()["lasttick"]
        #display(f"DIR={DIR}; snake={snake}; fruit={fruit}; timesincelasttick={sincelasttick}")
        if sincelasttick>0.15:
          logic()
          globals()["lasttick"]=curtime
        draw()
        if snake[-1][0]<0 or snake[-1][0]>canvasE.width//tilesize or snake[-1][1]<0 or snake[-1][1]>canvasE.height//tilesize:pass
        else:window.requestAnimationFrame(create_proxy(gameloop))
      window.requestAnimationFrame(create_proxy(gameloop))
    </script>
</body>
</html>
