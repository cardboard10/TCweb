<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pynix Arcade: snake</title>
    
    <!-- PyScript Core Engine -->
    <link rel="stylesheet" href="https://pyscript.net/releases/2026.7.3/core.css">
    <script type="module" src="https://pyscript.net/releases/2026.7.3/core.js"></script>
</head>
<body style="background: #111; color: white; text-align: center; font-family: monospace; margin-top: 30px;">

    
    
    <!-- Container where Python will inject the canvas -->
    <div id="game-container"></div>
    <script type="py">
      from random import randint
      from js import document, window
      from pyodide.ffi import create_proxy
      canvasE=document.createElement("canvas")
      canvasE.width=600
      canvasE.height=600
      canvasE.style.border="2px solid #ffffff"
      canvasE.style.background="#777777"
      document.getElementById("game-container").appendChild(canvasE)
      canvas=canvasE.getContext("2d")
      snake=[(0,0)]
      fruit=(5,0)
      DIR=(0,0)
      tilesize=50
      def draw():
        canvas.fillStyle="#777777"
        canvas.fillRect(0,0,canvasE.width,canvasE.height)
        canvas.fillStyle="#0000ff"
        for seg in snake:
          canvas.fillRect(seg[0]*tilesize,seg[1]*tilesize,tilesize,tilesize)
        canvas.fillStyle="#ff0000"
        canvas.fillRect(fruit[0]*tilesize,fruit[1]*tilesize,tilesize,tilesize)
      def logic():
        ate=False
        snake.append(snake[-1][0]+DIR[0],snake[-1][1]+DIR[1])
        if fruit in snake:
          ate=True
          fruit=(randint(0,canvasE.width//tilesize),randint(0,canvasE.height//tilesize))
        else:
          snake.pop(0)
    </script>
</body>
</html>
